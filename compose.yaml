name: question-garden
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: questiongarden
      POSTGRES_USER: questiongarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U questiongarden -d questiongarden']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://questiongarden:${POSTGRES_PASSWORD}@db:5432/questiongarden
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      DEMO_PAYMENTS_ENABLED: ${DEMO_PAYMENTS_ENABLED:-true}
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost}
      CREDIT_TIMEZONE: Asia/Kolkata
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${PUBLIC_BIND:-127.0.0.1}:80:80'
      - '${PUBLIC_BIND:-127.0.0.1}:443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  ollama_data:
